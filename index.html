<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ELİT Catalogue</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SPLASH -->

    <div id="splash">
        <h1>ELİT</h1>
    </div>


    <!-- MAIN APP -->

    <main id="app" class="hidden">

        <header>
            <h1>ELİT</h1>
            <p>Catalogue</p>
        </header>


        <!-- BRANDS -->

        <section id="brands">

            <h2>Brands</h2>

            <div class="brand-list">

                <button class="brand-card"
                        onclick="openBrand('Pierre Cardin')">
                    Pierre Cardin
                </button>

                <button class="brand-card">
                    Benetton
                </button>

                <button class="brand-card">
                    Ferre
                </button>

            </div>

        </section>


        <!-- YEARS -->

        <section id="years" class="hidden">

            <button class="back-button"
                    onclick="showBrands()">
                ← Back
            </button>

            <div class="selection-header">

                <p id="selected-brand"></p>

                <h2>Select Year</h2>

            </div>

            <div class="year-list">

                <button class="year-card"
                    onclick="openYear(2026)">
                    2026
                </button>

                <button class="year-card">
                    2025
                </button>

            </div>

        </section>
        
        <!-- SEASONS -->

        <section id="seasons" class="hidden">

            <button class="back-button"
                    onclick="showYears()">
                ← Back
            </button>

            <div class="selection-header">

                <p id="selected-year"></p>

                <h2>Select Season</h2>

            </div>

            <div class="year-list">

                <button class="year-card"
                        onclick="openSeason('K')">
                    Winter
                </button>

                <button class="year-card"
                        onclick="openSeason('Y')">
                    Summer
                </button>
            </div>

        </section>

        <!-- DEPARTMENTS -->

        <section id="departments" class="hidden">

            <button class="back-button"
                    onclick="showSeasonsFromDepartments()">
                ← Back
            </button>

            <div class="selection-header">
                <p id="selected-department-path"></p>
                <h2>Departments</h2>
            </div>

            <div id="department-list"
                 class="year-list">
            </div>

        </section>
        
        <!-- CATEGORIES -->

        <section id="categories" class="hidden">

            <button class="back-button"
                    onclick="showSeasons()">
                ← Back
            </button>

            <div class="selection-header">

                <p id="selected-season"></p>

                <h2>Categories</h2>

            </div>

            <div id="category-list"
                 class="year-list">
            </div>

        </section>
        
        <!-- DYNAMIC CATALOGUE LEVEL -->

        <section id="catalogue-level" class="hidden">

            <button class="back-button"
                    onclick="goBackCatalogueLevel()">
                ← Back
            </button>

            <div class="selection-header">
                <p id="catalogue-path"></p>
                <h2 id="catalogue-level-title">Catalogue</h2>
            </div>

            <div id="catalogue-level-list"
                 class="year-list">
            </div>

        </section>
        
        <!-- PRODUCTS -->

        <section id="products" class="hidden">

            <button class="back-button"
                    onclick="showCategories()">
                ← Back
            </button>

            <div class="selection-header">

                <p id="selected-category"></p>

                <h2>Products</h2>

            </div>

            <div id="product-list"
                 class="product-list">
            </div>

        </section>
        
    </main>


    <script>

        const splash =
            document.getElementById("splash");

        const app =
            document.getElementById("app");
            
        


        /* SPLASH */

        setTimeout(() => {

            splash.classList.add("hide");

            app.classList.remove("hidden");

            setTimeout(() => {

                splash.remove();

            }, 600);

        }, 1500);


        /* NAVIGATION */

        let catalogueData = null;

        let currentBrand = null;
        let currentYear = null;
        let currentSeason = null;
        let currentPath = [];


        /* -------------------------
           LOAD CATALOGUE
        ------------------------- */

        async function loadCatalogue() {

            if (catalogueData) {
                return catalogueData;
            }

            const response =
                await fetch("catalogue-generated.json");

            catalogueData =
                await response.json();

            return catalogueData;
        }


        /* -------------------------
           BRAND
        ------------------------- */

        function openBrand(brand) {

            document
                .getElementById("brands")
                .classList.add("hidden");

            document
                .getElementById("years")
                .classList.remove("hidden");

            currentBrand = brand;

            document
                .getElementById("selected-brand")
                .textContent = brand;
        }


        function showBrands() {

            document
                .getElementById("years")
                .classList.add("hidden");

            document
                .getElementById("brands")
                .classList.remove("hidden");
        }


        /* -------------------------
           YEAR
        ------------------------- */

        function openYear(year) {

            document
                .getElementById("years")
                .classList.add("hidden");

            document
                .getElementById("seasons")
                .classList.remove("hidden");

            currentYear = Number(year);

            document
                .getElementById("selected-year")
                .textContent =
                currentBrand + " • " + year;
        }


        function showYears() {

            document
                .getElementById("seasons")
                .classList.add("hidden");

            document
                .getElementById("years")
                .classList.remove("hidden");
        }


        /* -------------------------
           SEASON
        ------------------------- */

        async function openSeason(season) {

            currentSeason =
                season === "K"
                    ? "WINTER"
                    : "SUMMER";

            currentPath = [];

            document
                .getElementById("seasons")
                .classList.add("hidden");

            document
                .getElementById("catalogue-level")
                .classList.remove("hidden");

            await openCatalogueLevel();
        }


        /* -------------------------
           DYNAMIC LEVEL
        ------------------------- */

        async function openCatalogueLevel() {

            const data =
                await loadCatalogue();

            const matchingProducts =
                data.products.filter(product => {

                    if (
                        product.brand !== currentBrand ||
                        Number(product.year) !== currentYear ||
                        product.season !== currentSeason
                    ) {
                        return false;
                    }

                    for (
                        let i = 0;
                        i < currentPath.length;
                        i++
                    ) {

                        if (
                            !product.path ||
                            product.path[i] !== currentPath[i]
                        ) {
                            return false;
                        }
                    }

                    return true;
                });


            const nextFolders =
                [...new Set(
                    matchingProducts
                        .filter(product =>
                            product.path &&
                            product.path.length >
                            currentPath.length
                        )
                        .map(product =>
                            product.path[
                                currentPath.length
                            ]
                        )
                )];


            document
                .getElementById("catalogue-path")
                .textContent =
                [
                    currentBrand,
                    currentYear,
                    currentSeason,
                    ...currentPath
                ].join(" • ");


            const list =
                document.getElementById(
                    "catalogue-level-list"
                );

            list.innerHTML = "";


            /* THERE ARE MORE FOLDERS */

            if (nextFolders.length > 0) {

                document
                    .getElementById(
                        "catalogue-level-title"
                    )
                    .textContent = "Select";

                nextFolders.forEach(folder => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "year-card";

                    button.textContent =
                        folder;

                    button.onclick = () => {

                        currentPath.push(folder);

                        openCatalogueLevel();
                    };

                    list.appendChild(button);
                });

                return;
            }


            /* NO MORE FOLDERS:
               SHOW PRODUCTS */

            showProducts(matchingProducts);
        }


        /* -------------------------
           PRODUCTS
        ------------------------- */

        function showProducts(products) {

            document
                .getElementById("catalogue-level")
                .classList.add("hidden");

            document
                .getElementById("products")
                .classList.remove("hidden");

            document
                .getElementById("selected-category")
                .textContent =
                currentPath.length > 0
                    ? currentPath[
                        currentPath.length - 1
                    ]
                    : currentSeason;


            const productList =
                document.getElementById(
                    "product-list"
                );

            productList.innerHTML = "";


            products.forEach(product => {

                const card =
                    document.createElement(
                        "button"
                    );

                card.className =
                    "product-card";


                const cover =
                    product.colors.length > 0
                        ? product.colors[0].webCover
                        : null;


                card.innerHTML = `
                    <div class="product-image-placeholder">

                        ${
                            cover
                                ? `<img src="${cover}"
                                        alt="${product.code}">`
                                : "No Photo"
                        }

                    </div>

                    <div class="product-card-info">
                        <strong>
                            ${product.code}
                        </strong>
                    </div>
                `;


                productList.appendChild(card);
            });
        }


        /* -------------------------
           BACK FROM PRODUCTS
        ------------------------- */

        function showCategories() {

            document
                .getElementById("products")
                .classList.add("hidden");

            document
                .getElementById("catalogue-level")
                .classList.remove("hidden");

            openCatalogueLevel();
        }


        /* -------------------------
           DYNAMIC BACK
        ------------------------- */

        function goBackCatalogueLevel() {

            if (currentPath.length > 0) {

                currentPath.pop();

                openCatalogueLevel();

                return;
            }


            document
                .getElementById("catalogue-level")
                .classList.add("hidden");

            document
                .getElementById("seasons")
                .classList.remove("hidden");
        }
    
    </script>

</body>

</html>
